name: Verify ALTO

on:
  pull_request:
  push:
    branches: [main, feature/alto-4-ui]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bundle JSX before bridge tests
        run: python tools/bundle_host.py
      - name: Run JavaScript and Premiere-host simulation tests
        run: |
          node tests/engine.cjs
          node tests/host.cjs
          node tests/iteration1.cjs
          node tests/frame-capture.cjs
          node tests/bridge.test.cjs
          node tests/local.cjs
          node tests/core.test.cjs
          node tests/production-update.cjs
          node --test tests/upstream/syncitol.test.cjs
      - name: Run Python worker tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Verify interface and previews
        env:
          MZ_QA_DIR: test-results/ui
        run: |
          node tests/ui.cjs
          node tests/alto-ui.cjs
          node tests/production-ui.cjs
      - name: Save interface previews
        uses: actions/upload-artifact@v4
        with:
          name: alto-ui-previews
          path: test-results/ui/*.png
          if-no-files-found: error
      - name: Build and verify release ZIP
        run: |
          python tools/build_release.py
          node tests/release-package.cjs
          python - <<'PY'
          import hashlib, pathlib, zipfile
          for zip_path in pathlib.Path("dist").glob("Montazhopa_*.zip"):
              with zipfile.ZipFile(zip_path) as archive:
                  assert archive.testzip() is None
              checksum = zip_path.with_suffix(".zip.sha256").read_text().split()[0]
              assert hashlib.sha256(zip_path.read_bytes()).hexdigest() == checksum
              print("PASS", zip_path.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: montazhopa-verified-package
          path: |
            dist/Montazhopa_*.zip
            dist/Montazhopa_*.zip.sha256
          if-no-files-found: error
          retention-days: 14
